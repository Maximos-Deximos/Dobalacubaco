<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Inscrição Hackathon</title>
</head>
<body>
  <h1>Inscrição Hackathon</h1>

  <form action="/submit" method="post">
    <input type="hidden" name="form_id" value="hackathon">

    <p>
      <label for="full_name">Nome completo</label>
      <input id="full_name" name="full_name" type="text" required placeholder="Seu nome">
    </p>

    <p>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required>
    </p>

    <p>
      <label for="phone">Telefone</label>
      <input id="phone" name="phone" type="tel">
    </p>

    <p>
      <label for="age">Idade</label>
      <input id="age" name="age" type="number" min="16">
    </p>

    <p>
      <label for="birth_date">Data de nascimento</label>
      <input id="birth_date" name="birth_date" type="date">
    </p>

    <p>
      <label for="organization">Organização</label>
      <input id="organization" name="organization" type="text" aria-label="Organização ou empresa">
    </p>

    <p>
      <label for="track">Trilha</label>
      <select id="track" name="track" required>
        <option value="">Selecione</option>
        <option value="ai">Inteligência Artificial</option>
        <option value="robotics">Robótica</option>
        <option value="health">Saúde</option>
      </select>
    </p>

    <fieldset>
      <legend>Nível de experiência</legend>
      <label><input type="radio" name="experience" value="beginner" required> Iniciante</label>
      <label><input type="radio" name="experience" value="intermediate"> Intermediário</label>
      <label><input type="radio" name="experience" value="advanced"> Avançado</label>
    </fieldset>

    <fieldset>
      <legend>Habilidades</legend>
      <label><input type="checkbox" name="skills" value="python"> Python</label>
      <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
      <label><input type="checkbox" name="skills" value="design"> Design</label>
      <label><input type="checkbox" name="skills" value="hardware"> Hardware</label>
    </fieldset>

    <p>
      <label for="project">Descrição do projeto</label>
      <textarea id="project" name="project" required placeholder="Descreva sua ideia"></textarea>
    </p>

    <p>
      <label><input type="checkbox" name="consent" required> Concordo com os termos e a política de privacidade</label>
    </p>

    <p>
      <input id="portfolio" name="portfolio" type="text" placeholder="https://...">
    </p>

    <p>
      <input id="website" name="website" type="url" aria-label="Site pessoal">
    </p>

    <p>
      <label for="disabled_field">Campo desabilitado</label>
      <input id="disabled_field" name="disabled_field" type="text" disabled>
    </p>

    <p>
      <label for="readonly_field">Campo somente leitura</label>
      <input id="readonly_field" name="readonly_field" type="text" readonly value="fixo">
    </p>

    <p>
      <label for="upload">Anexo</label>
      <input id="upload" name="upload" type="file">
    </p>

    <button type="submit">Enviar</button>
  </form>
</body>
</html>
